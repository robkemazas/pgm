name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS simulator (no codesign)
        run: flutter build ios --simulator --no-codesign

      - name: Zip simulator app for Appetize
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../ios-simulator.zip Runner.app

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-simulator.zip
